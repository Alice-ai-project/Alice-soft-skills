services:
  # New Next.js frontend (active development)
  frontend-next:
    build:
      context: ./frontend-next
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* vars are baked in at build time; use the host-accessible URL
        NEXT_PUBLIC_API_URL: http://167.233.41.7:8000
    container_name: alice-frontend-next
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - alice-network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: alice-backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL}
      N8N_ROADMAP_WEBHOOK_URL: ${N8N_ROADMAP_WEBHOOK_URL}
    ports:
      - "8000:8000"
    depends_on:
      - db
    networks:
      - alice-network
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: alice-db
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - alice-network
    restart: unless-stopped

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: alice-n8n
    env_file:
      - .env
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: db
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_HOST: ${N8N_HOST}
      N8N_PORT: 5678
      WEBHOOK_URL: ${N8N_WEBHOOK_URL}
      N8N_PROTOCOL: http
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    ports:
      - "5678:5678"
    depends_on:
      - db
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - alice-network
    restart: unless-stopped

networks:
  alice-network:
    driver: bridge

volumes:
  postgres_data:
  n8n_data:
